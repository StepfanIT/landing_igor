<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Технокет — Bobcat і JCB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; background: #131313; color: #fff; font-family: "Tektur", system-ui, sans-serif; padding: 24px; }
      h1 { font-size: clamp(28px, 6vw, 64px); text-transform: uppercase; text-align: center; margin-bottom: 32px; }
      .grid { display: grid; gap: 16px; width: min(100%, 880px); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      a { display: block; padding: 40px 32px; text-decoration: none; color: #131313; font-size: clamp(36px, 7vw, 72px); text-transform: uppercase; transition: transform .2s; }
      a span { display: block; font-size: 16px; margin-top: 8px; opacity: .75; }
      a:hover { transform: translateY(-4px); }
      .bobcat { background: #f26a1b; }
      .jcb { background: #fbb503; }
    </style>
  </head>
  <body>
    <main>
      <h1>Продаж та оренда спецтехніки</h1>
      <div class="grid">
        <a class="bobcat" href="./bobcat/">Bobcat<span>Компактна техніка →</span></a>
        <a class="jcb" href="./jcb/">JCB<span>Екскаватори-навантажувачі →</span></a>
      </div>
    </main>
  </body>
</html>
